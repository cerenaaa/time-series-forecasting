name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy statsmodels pytest
      - name: Test revenue data generator
        run: |
          python - <<'PYEOF'
          from data.synthetic_revenue import generate_revenue_series
          df = generate_revenue_series(n_months=36)
          assert len(df) == 36
          assert df['revenue'].min() >= 0
          assert df['revenue'].mean() > 5000
          print('revenue data OK, mean =', round(df['revenue'].mean(), 0))
          PYEOF
      - name: Test STL decomposition
        run: |
          python - <<'PYEOF'
          import numpy as np
          from models.decomposition import decompose
          t = np.arange(60)
          series = 1000 + 5 * t + 200 * np.sin(2 * np.pi * t / 12)
          result = decompose(series, period=12)
          assert 0 <= result.seasonal_strength <= 1
          assert 0 <= result.trend_strength <= 1
          assert len(result.seasonal) == len(series)
          print('decompose OK, seasonal_strength =', result.seasonal_strength)
          PYEOF
      - name: Test backtester metrics
        run: |
          python - <<'PYEOF'
          import numpy as np
          from evaluation.backtester import mae, rmse, mape
          a = np.array([100.0, 200.0, 300.0])
          p = np.array([110.0, 190.0, 310.0])
          assert mae(a, p) == 10.0
          assert abs(mape(a, p) - 4.44) < 0.1
          print('backtester metrics OK')
          PYEOF
      - name: Run forecast demo
        run: |
          python - <<'PYEOF'
          import subprocess, sys
          r = subprocess.run([sys.executable, 'forecast.py', '--horizon', '6', '--model', 'decompose'], capture_output=True, text=True)
          assert r.returncode == 0, r.stderr
          print('forecast demo OK')
          PYEOF
